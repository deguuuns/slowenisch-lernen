name: Validate learning app

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run audit:curriculum
      - run: npm run test:regression
      - run: npm run lint
      - run: npm run build
      - name: Security audit (critical threshold)
        run: npm audit --audit-level=critical
