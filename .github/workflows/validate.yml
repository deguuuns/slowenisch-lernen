name: Validate learning app

on:
  push:
    branches:
      - main
  pull_request:

env:
  NEXT_PUBLIC_ZERO_SCROLL_QA: '1'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run audit:curriculum
      - run: npm run test:regression
      - run: npm run lint
      - run: npm run build
      - name: Install browser QA runtime
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Start production build
        run: |
          npm start > /tmp/slowenisch-next.log 2>&1 &
          echo $! > /tmp/slowenisch-next.pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/qa-zero-scroll?case=input-long > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/slowenisch-next.log
          exit 1
      - name: Zero-scroll browser checks
        run: node tests/zero-scroll-browser.mjs
      - name: Upload zero-scroll screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zero-scroll-screenshots
          path: artifacts/zero-scroll
          if-no-files-found: ignore
      - name: Security audit (critical threshold)
        run: npm audit --audit-level=critical
