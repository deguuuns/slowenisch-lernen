name: Add lint tooling

on:
  push:
    branches:
      - agent/adaptive-cloud-foundation
    paths:
      - .github/workflows/add-lint-tooling.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/adaptive-cloud-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install compatible lint tooling
        run: npm install --save-dev eslint@8.57.1 eslint-config-next@14.2.35
      - name: Commit generated package metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit"
          else
            git commit -m "Add Next.js lint tooling"
            git push origin HEAD:agent/adaptive-cloud-foundation
          fi
